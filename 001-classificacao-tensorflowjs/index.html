<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classificador de Classe Social</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>Classificador de Classe Social</h1>
    <p>Rede neural treinada com TensorFlow.js</p>
  </header>

  <div id="status-box">
    <div class="spinner" id="spinner"></div>
    <span id="status-text">Treinando modelo...</span>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    <span id="epoch-label" style="font-size:0.8rem;color:#6b7280;min-width:60px;text-align:right"></span>
  </div>

  <div class="card">
    <h2>Dados da pessoa</h2>
    <div class="grid">
      <div class="field">
        <label for="idade">Idade</label>
        <input type="number" id="idade" min="1" max="120" placeholder="ex: 35" disabled>
      </div>
      <div class="field">
        <label for="tamanho_familia">Tamanho da família</label>
        <input type="number" id="tamanho_familia" min="1" max="20" placeholder="ex: 4" disabled>
      </div>
      <div class="field full">
        <label for="renda">Renda per capita (R$)</label>
        <div class="input-prefix">
          <span>R$</span>
          <input type="number" id="renda" min="0.01" step="0.01" placeholder="ex: 2500,00" disabled>
        </div>
      </div>
      <div class="field full">
        <label for="escolaridade">Escolaridade</label>
        <select id="escolaridade" disabled>
          <option value="">Selecione...</option>
          <option>Sem instrução</option>
          <option>Ensino Fundamental</option>
          <option>Ensino Médio</option>
          <option>Graduação</option>
          <option>Pós-graduação</option>
          <option>Mestrado</option>
          <option>Doutorado</option>
        </select>
      </div>
      <div class="field">
        <label for="regiao">Região</label>
        <select id="regiao" disabled>
          <option value="">Selecione...</option>
          <option>Sudeste</option>
          <option>Sul</option>
          <option>Centro-Oeste</option>
          <option>Nordeste</option>
          <option>Norte</option>
        </select>
      </div>
      <div class="field">
        <label for="ocupacao">Ocupação</label>
        <select id="ocupacao" disabled>
          <option value="">Selecione...</option>
          <option>CLT</option>
          <option>Autonomo</option>
          <option>Aposentado</option>
          <option>Desempregado</option>
        </select>
      </div>
    </div>
    <button id="btn-analisar" disabled>Analisar</button>
  </div>

  <div id="resultado">
    <h2>Resultado</h2>
    <div class="resultado-destaque">
      <div class="classe-badge" id="res-badge"></div>
      <div class="resultado-texto">
        <h3 id="res-titulo"></h3>
        <p id="res-subtitulo"></p>
      </div>
    </div>
    <div class="barras" id="res-barras"></div>
  </div>
</div>

<script src="./index.js"></script>
</body>
</html>
